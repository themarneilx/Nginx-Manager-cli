name: Linux compatibility
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: arch
            image: archlinux:base
          - family: debian
            image: debian:stable-slim
          - family: ubuntu
            image: ubuntu:24.04
          - family: fedora
            image: fedora:latest
          - family: rocky
            image: rockylinux:9
    container:
      image: ${{ matrix.image }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Install tools in the disposable CI container
        env:
          FAMILY: ${{ matrix.family }}
        run: |
          case "$FAMILY" in
            arch) pacman -Syu --noconfirm --needed git python nginx openssl ca-certificates shellcheck ;;
            debian|ubuntu)
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y git python3 nginx openssl ca-certificates shellcheck
              ;;
            fedora) dnf install -y git python3 nginx openssl ca-certificates ShellCheck ;;
            rocky)
              dnf install -y epel-release
              dnf install -y git python3 nginx openssl ca-certificates ShellCheck
              ;;
          esac
      - uses: actions/checkout@v7
      - name: Report detected platform
        run: ./nginx-manager.sh os-info
      - name: Syntax, static analysis, unit and isolated integration tests
        run: ./tests/run.sh
